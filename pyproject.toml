[project]
name = "truckSaathi"
version = "0.1.0"
description = "Voice-powered logistics booking using AI."
requires-python = ">=3.12"
dependencies = [
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "requests-toolbelt>=1.0.0",
    "rich>=15.0.0",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
